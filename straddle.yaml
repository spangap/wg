# wg — WireGuard tunnel for spangap.
#
# Vendors trombik/esp_wireguard with the IDF 5.x netif->state PPP workaround
# (drops out once upstream propagates).
schema_version: 1
name: spangap/wg
prefix: wg
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
# Auto-init: spangap-inside folds this into the buildable's generated
# spangapInitStraddles() dispatcher, so wg comes up with no consumer main.cpp
# edit. wgInit() only registers net-event callbacks + a CLI verb + storage
# defaults (and an LCD settings pane when lcd is staged) — all of net/storage/
# cli/lcd are up by the time the straddle band runs.
init:
  - call: wgInit
  - call: wgLcdRegister
    when: spangap/spangap-lcd
# Browser auto-registration: the browser-half parallel to init:. When a
# buildable with a browser half stages wg, spangap-inside imports registerWg
# from wg/modules/wg into the generated straddles.gen.ts and injects the
# file: dep — so the WireGuard pane appears under Settings → Network with no
# consumer edit. Mirrors how wgInit() rides the firmware dispatcher.
browser_register:
  - call: registerWg
