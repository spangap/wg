# wg — WireGuard tunnel for spangap.
#
# Vendors trombik/esp_wireguard with the IDF 5.x netif->state PPP workaround
# (drops out once upstream propagates).
schema_version: 1
name: spangap/wg
prefix: wg
version: 0.0.0
firmware: esp-idf
platforms: [idf]
requires:
  - spangap/spangap-net
# Auto-init: spangap-inside constructs WgService and calls its onInit() in the
# generated dispatcher, so wg comes up with no consumer main.cpp edit. onInit()
# only registers net-event callbacks + a CLI verb + storage defaults (and an LCD
# settings pane when lcd is staged) — all of net/storage/cli/lcd are up by the
# time the straddle band runs.
services:
  - { class: WgService, header: wg.h }

# Declarative settings: both surfaces generated from this block. No row carries
# a default: the private key lives in secrets.wg.key (seeded in wg.cpp) and the
# s.wg.* keys use read-site fallbacks.
settings:
  - at:
      - { id: network, label: "Internet", order: 2 }
      - { id: wireguard, label: "WireGuard", short: "WG" }
    rows:
      - switch: { label: "Enable", key: "s.wg.enable" }
      - section: "Our Side"
      - text:   { label: "IP Address", key: "s.wg.address" }
      - text:   { label: "Netmask", key: "s.wg.netmask" }
      - text:   { label: "DNS", key: "s.wg.dns" }
      - slider: { label: "Keepalive", key: "s.wg.keepalive", min: 0, max: 300 }
      # The private key lives in secrets.* and is never synced, so wg.cpp
      # publishes the sentence about it rather than the value.
      - value:  { label: "Private key", key: "wg.key_state" }
      - value:  { label: "Public key", key: "s.wg.pubkey", copyable: true }
      - button:
          label: "Generate key"
          do:
            dialog:
              text: "Generate a new key pair? The current private key is replaced, and every peer configured with the old public key stops accepting this device until it is given the new one."
              buttons:
                - { label: "Cancel" }
                - label: "Generate"
                  danger: true
                  do: { set: { key: "wg.keygen", value: "1", edge: true } }
      - section: "Other Side"
      - text:   { label: "IP or Name", key: "s.wg.endpoint" }
      - text:   { label: "Peer public key", key: "s.wg.peer_pubkey" }
